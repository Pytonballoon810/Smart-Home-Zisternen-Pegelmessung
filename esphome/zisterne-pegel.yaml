# =============================================================================
# Zisternen-Pegelmessung mit hydrostatischer Sonde
# =============================================================================
# Hardware:
#   - Sonde TL-136, 4-20 mA, 2-Leiter, Messbereich 0-3 m, Luftfuehrungskabel
#   - JOY-IT KY-053 / RB-ADC01 (ADS1115, 16 Bit, I2C, Adresse 0x48)
#   - ESP8266 (D1 mini o.ae.)
#   - Buerdewiderstand R1 100 Ohm, 0,1 %, <= 50 ppm/K, >= 0,25 W
#   - Netzteil 19 V DC, >= 300 mA
#
# Verdrahtung ueber die Interface-Platine v1.1 (siehe hardware/ und
# docs/pcb-specification.md). Die Platine traegt R1, R2, C3 und den
# MP1584-Wandler; hier ist nur die Signalkette dargestellt:
#
#   19V (+) ---------------> J1 -> Sonde (+)          [J2 LOOP+]
#   Sonde (-) --+---------->  R2 1k --+-------------> ADS1115 A0
#               |                     |
#             R1 100R              C3 100n
#               |                     |
#   19V (-) ----+---------------------+-------------> GND (gemeinsame Masse!)
#
#   ESP 3V3 ---------------> ADS1115 VDD
#   ESP D2 (GPIO4) --------> ADS1115 SDA
#   ESP D1 (GPIO5) --------> ADS1115 SCL
#
# R2 und C3 sind Schutz und Filter, kein Teil der Messung: R2 begrenzt den
# Strom in die ADC-Schutzdioden, C3 siebt das Schaltrauschen des MP1584.
# Auf dem Steckbrett koennen beide entfallen - dann geht Sonde (-) direkt
# auf A0.
#
# ACHTUNG Netzteil: Die Platine hat KEINEN Verpolungsschutz. Vor dem ersten
# Einschalten die Polaritaet an J1 pruefen. Und den MP1584 VOR dem Einsetzen
# des D1 mini auf 5,0 V einstellen - ab Werk ist der Trimmer beliebig.
#
# WICHTIG: 100 Ohm statt 150 Ohm. Das Modul arbeitet mit 3,3 V, der ADS1115
# vertraegt am Eingang maximal VDD + 0,3 V = 3,6 V. Bei 150 Ohm laege ein
# Sondenfehler mit 30 mA bei 4,5 V und wuerde den Wandler zerstoeren.
# =============================================================================

substitutions:
  # ---- HIER ANPASSEN, sobald die Masse bekannt sind -------------------------
  # Innendurchmesser der Zisterne in Metern
  zisterne_durchmesser: "2.00"
  # Hoehe der Pumpenansaugung ueber dem Zisternenboden in cm.
  # Alles darunter ist nicht nutzbar und wird als 0 L angezeigt.
  ansaughoehe_cm: "25"
  # Maximale nutzbare Fuellhoehe ueber Ansaughoehe in cm (bis Ueberlauf)
  max_hoehe_cm: "250"

esphome:
  name: zisterne-pegel
  friendly_name: Zisterne Pegel

esp8266:
  board: d1_mini
  # Ohne restore_from_flash gehen gespeicherte Werte bei jedem Neustart
  # verloren. Kostet hier nichts und ist bei Zaehlern/Statistik noetig.
  restore_from_flash: true

logger:
  level: INFO

api:
  encryption:
    key: !secret zisterne_pegel_api_key

ota:
  - platform: esphome
    password: !secret zisterne_pegel_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Zisterne-Pegel"
    password: !secret zisterne_pegel_ap_password

captive_portal:

# =============================================================================
# I2C und ADC
# =============================================================================

i2c:
  sda: D2
  scl: D1
  scan: true
  id: bus_a

ads1115:
  - address: 0x48

# =============================================================================
# Sensoren
# =============================================================================

sensor:

  # ---------------------------------------------------------------------------
  # 1. Rohspannung am Buerdewiderstand
  # ---------------------------------------------------------------------------
  # gain: 4.096 ist die passende Wahl: Das Nutzsignal geht bis 2,0 V, im
  # Fehlerfall bis 3,0 V. Mit 2.048 waere der Fehlerfall ausserhalb des
  # Messbereichs und der Wert wuerde stumm am Anschlag kleben.
  # Aufloesung bei 4.096: 125 uV, also rund 12.800 Stufen ueber den Messbereich.
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 4.096
    name: "Sonde Rohspannung"
    id: sonde_spannung
    update_interval: 5s
    accuracy_decimals: 4
    unit_of_measurement: "V"
    entity_category: diagnostic
    filters:
      # Median gegen einzelne Ausreisser, danach gleitender Mittelwert.
      # Ein Zisternenpegel aendert sich in Stunden - eine Mittelung ueber
      # eine Minute kostet nichts und beruhigt das Signal deutlich.
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 3
      - sliding_window_moving_average:
          window_size: 12
          send_every: 12

  # ---------------------------------------------------------------------------
  # 2. Wassersaeule ueber der Sonde in cm
  # ---------------------------------------------------------------------------
  # Theoretische Kennlinie bei 100 Ohm Buerde und 0-3 m Sonde:
  #    4 mA -> 0,400 V ->   0 cm
  #   20 mA -> 2,000 V -> 300 cm
  #
  # DIESE WERTE SIND EIN STARTPUNKT. Nach dem Einbau zweipunktig nachmessen:
  #   - Sonde in Luft haengend (0 cm) -> Spannung notieren
  #   - Sonde auf bekannter Tiefe     -> Spannung notieren
  # und die beiden Zeilen ersetzen. Die Toleranz des Buerdewiderstands und
  # der Sondenoffset gehen sonst direkt in die Anzeige ein.
  - platform: copy
    source_id: sonde_spannung
    name: "Zisterne Wassersaeule"
    id: wassersaeule_cm
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    icon: mdi:arrow-expand-vertical
    filters:
      - calibrate_linear:
          - 0.400 -> 0.0
          - 2.000 -> 300.0
      # Unter 0 gibt es physikalisch nicht - Rauschen um den Nullpunkt
      # wuerde sonst negative Werte erzeugen.
      - lambda: return x < 0 ? 0 : x;

  # ---------------------------------------------------------------------------
  # 3. Nutzbare Fuellhoehe ueber Ansaughoehe
  # ---------------------------------------------------------------------------
  # Was unterhalb der Pumpenansaugung steht, kann nicht gefoerdert werden und
  # darf nicht als Vorrat erscheinen. "Leer" heisst hier: unter Ansaughoehe,
  # nicht "kein Wasser".
  - platform: copy
    source_id: wassersaeule_cm
    name: "Zisterne nutzbare Hoehe"
    id: nutzbare_hoehe_cm
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - offset: -${ansaughoehe_cm}
      - lambda: return x < 0 ? 0 : x;

  # ---------------------------------------------------------------------------
  # 4. Nutzbarer Vorrat in Litern
  # ---------------------------------------------------------------------------
  # Liter = Hoehe[cm] / 100 * pi * (d/2)^2 * 1000
  - platform: copy
    source_id: nutzbare_hoehe_cm
    name: "Zisterne Fuellstand"
    id: fuellstand_liter
    unit_of_measurement: "L"
    device_class: water
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:water-well
    filters:
      - lambda: |-
          const float d = ${zisterne_durchmesser};
          const float flaeche = 3.14159265f * (d / 2.0f) * (d / 2.0f);
          return x / 100.0f * flaeche * 1000.0f;

  # ---------------------------------------------------------------------------
  # 5. Fuellstand in Prozent
  # ---------------------------------------------------------------------------
  - platform: copy
    source_id: nutzbare_hoehe_cm
    name: "Zisterne Fuellstand Prozent"
    id: fuellstand_prozent
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:gauge
    filters:
      - lambda: |-
          float p = x / ${max_hoehe_cm} * 100.0f;
          if (p < 0) p = 0;
          if (p > 100) p = 100;
          return p;

  # ---------------------------------------------------------------------------
  # 6. Diagnose
  # ---------------------------------------------------------------------------
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    unit_of_measurement: "Signal %"
    entity_category: diagnostic
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

# =============================================================================
# Stoerungserkennung
# =============================================================================
# Der grosse Vorteil von 4-20 mA: Ein Kabelbruch liefert 0 mA, also 0 V.
# Das ist von "Zisterne leer" (4 mA, 0,4 V) klar unterscheidbar.
# Ohne diese Pruefung wuerde ein Leitungsdefekt als leere Zisterne erscheinen.

binary_sensor:
  - platform: template
    name: "Zisterne Sonde Stoerung"
    id: sonde_stoerung
    device_class: problem
    lambda: |-
      float v = id(sonde_spannung).state;
      if (isnan(v)) return {};
      // Unter 0,3 V: weniger als 4 mA -> Kabelbruch oder Sonde tot
      // Ueber 2,3 V: mehr als 20 mA -> Messbereich ueberschritten oder Kurzschluss
      return (v < 0.30f) || (v > 2.30f);